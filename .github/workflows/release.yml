# 公开发布：打版本 tag 时构建镜像并推到 Docker Hub。
#
# Dockerfile 的基础镜像默认就是公开镜像（python:3.12-slim），这里不需要传任何
# build-arg 覆盖。
#
# 只构建 amd64：目前没有 arm64 的使用需求，需要时再加（届时要补 QEMU 步骤）。
#
# 凭据来自组织级 secrets：DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN。
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions: {}

env:
  IMAGE_0: 4pdosc/continuation_gateway

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # latest 是用户不指定版本时拿到的镜像，所以预发布 tag（如 v0.1.0-rc1）只构建、
      # 不占用 latest。
      - name: Work out the tags to push
        id: tags
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) echo "prerelease ${version}: not tagging latest" ;;
          esac
          {
            echo "t0<<T_EOF"
            echo "${IMAGE_0}:${version}"
            case "$version" in
              *-*) ;;
              *) echo "${IMAGE_0}:latest" ;;
            esac
            echo "T_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push continuation_gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.t0 }}
