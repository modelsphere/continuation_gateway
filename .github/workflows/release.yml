# 公开发布：打版本 tag 时构建镜像并推到 Docker Hub。
#
# Dockerfile 的基础镜像默认就是公开镜像（python:3.12-slim），这里不需要传任何
# build-arg 覆盖。
#
# Built for linux/amd64 and linux/arm64; arm64 is built under QEMU emulation.
# A pull request builds both platforms without logging in or pushing, so a change
# that breaks either build shows up before a release tag does.
#
# 凭据来自组织级 secrets：DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN。
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  pull_request:

permissions: {}

env:
  IMAGE_0: 4pdosc/continuation_gateway

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # latest 是用户不指定版本时拿到的镜像，所以预发布 tag（如 v0.1.0-rc1）只构建、
      # 不占用 latest。
      - name: Work out the tags to push
        id: tags
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # build-only run: a placeholder tag, never pushed
            { echo "t0<<T_EOF"; echo "${IMAGE_0}:pr-${{ github.event.number }}"; echo "T_EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) echo "prerelease ${version}: not tagging latest" ;;
          esac
          {
            echo "t0<<T_EOF"
            echo "${IMAGE_0}:${version}"
            case "$version" in
              *-*) ;;
              *) echo "${IMAGE_0}:latest" ;;
            esac
            echo "T_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push continuation_gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.t0 }}
