# 打 git tag 自动 build continuation_gateway 镜像并 push 到 harbor。
#
# 沿用 cache_aware_router 的惯例：org 共享 `public-buildx` runner —— docker daemon 已内置
# harbor 鉴权，CI 里不需要 docker login，也不需要配 HARBOR_ 变量，直接 docker build + docker push。
#
# Dockerfile 的基础镜像和 PyPI 源是 build arg，【默认值指向 Docker Hub / PyPI】供仓外用户直接
# docker build；本 runner 到不了 Docker Hub，所以这里用 --build-arg 覆盖成内网的。
#   BUILDER_IMAGE:  内网 harbor 里自带 Python 3.12 的 ubuntu 底座（项目只依赖 aiohttp，
#                   该镜像里直接 pip install 即可）。
#   PIP_INDEX_URL:  PyPI 镜像，runner 直连 PyPI 慢/不通时用。
# DOCKER_BUILDKIT=0：出简单 v2 manifest，containerd 直接拉（避 buildkit attestation）。
#
# 触发：仅打 git tag（如 v0.1.0）。产物 harbor.4pd.io/hardcore-tech/continuation_gateway:<tag>
# （+ :latest）。
# 生效前提：本文件要在【被打 tag 的 commit】上（先合进 master），再打 tag。

stages: [build]

variables:
  IMAGE: harbor.4pd.io/hardcore-tech/continuation_gateway
  DOCKER_BUILDKIT: "0"
  BUILDER_IMAGE: harbor.4pd.io/sagegpt-aio/pk_platform/ubuntu_python:24.04_3.12
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

build:image:
  stage: build
  tags: [public-buildx]            # org 共享构建 runner（在线到 harbor；docker 已 login harbor）
  rules:
    - if: '$CI_COMMIT_TAG'          # 只在打 tag 时构建；其它 push 不触发
  script:
    - >
      docker build
      --build-arg "BUILDER_IMAGE=$BUILDER_IMAGE"
      --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL"
      -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - docker push "$IMAGE:latest"
